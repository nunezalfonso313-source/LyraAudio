name: Build Lyra KERNEL v1.8 Remastered
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: AEGIS - RESTRUCTURACIÓN INTEGRAL V1.8
        run: |
          # Limpieza de workspace
          find . -mindepth 1 -maxdepth 1 ! -name '.github' -exec rm -rf {} +
          
          # Estructura de directorios
          mkdir -p app/src/main/java/com/lyra/audiokernel
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values

          # 1. INFRAESTRUCTURA DE COMPILACIÓN
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat <<'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() } 
          }
          rootProject.name = 'LyraAudio'
          include ':app'
          EOF

          cat <<'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat <<'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.lyra.audiokernel'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lyra.audiokernel'
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName '1.8-AEGIS'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-common:1.3.1'
              implementation 'androidx.media3:media3-session:1.3.1'
              implementation 'com.google.guava:guava:33.0.0-android'
          }
          EOF

          # 2. RECURSOS VISUALES (REMASTERIZADOS)
          
          # Manifiesto
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application
                  android:label="Lyra KERNEL v1.8"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".LyraPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false" />
              </application>
          </manifest>
          EOF

          # NUEVO MENÚ DE TRES PUNTITOS
          cat <<'EOF' > app/src/main/res/menu/main_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/menu_all_music" android:title="TODA LA MUSICA" />
              <item android:id="@+id/menu_folders" android:title="CARPETAS" />
              <item android:id="@+id/menu_playlists" android:title="PLAYLIST" />
              <item android:id="@+id/menu_equalizer" android:title="ECUALIZADOR" />
              <item android:id="@+id/menu_search" android:title="BUSCAR" />
          </menu>
          EOF

          # LAYOUT REESTRUCTURADO (SIN VU, PORTADA GRANDE)
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0A0A0A">
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
                  
                  <ImageView android:id="@+id/album_art" android:layout_width="match_parent" android:layout_height="350dp" 
                      android:scaleType="centerCrop" android:background="#111111" />

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                      <TextView android:id="@+id/track_title" android:layout_width="match_parent" android:layout_height="wrap_content" 
                          android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold" android:singleLine="true" />
                      <TextView android:id="@+id/track_artist" android:layout_width="match_parent" android:layout_height="wrap_content" 
                          android:textColor="#00BFFF" android:textSize="15sp" />
                  </LinearLayout>

                  <SeekBar android:id="@+id/seek_bar" android:layout_width="match_parent" android:layout_height="wrap_content" android:progressTint="#00BFFF" android:thumbTint="#00BFFF" />
                  
                  <ListView android:id="@+id/playlist_view" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:divider="#1A1A1A" android:dividerHeight="1dp" />
              </LinearLayout>
          </androidx.coordinatorlayout.widget.CoordinatorLayout>
          EOF

          # 3. KERNEL JAVA (OPTIMIZADO V1.8)

          # Service con soporte High-Res (Tu lógica original)
          cat <<'EOF' > app/src/main/java/com/lyra/audiokernel/LyraPlaybackService.java
          package com.lyra.audiokernel;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Binder;
          import android.os.IBinder;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.DefaultRenderersFactory;

          public class LyraPlaybackService extends Service {
              private ExoPlayer player;
              private final IBinder binder = new LocalBinder();
              public class LocalBinder extends Binder { LyraPlaybackService getService() { return LyraPlaybackService.this; } }
              @Override
              public void onCreate() {
                  super.onCreate();
                  AudioAttributes highResAttributes = new AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                      .build();
                  DefaultRenderersFactory renderersFactory = new DefaultRenderersFactory(this)
                      .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON);
                  player = new ExoPlayer.Builder(this, renderersFactory)
                      .setAudioAttributes(highResAttributes, true)
                      .setHandleAudioAttributes(true)
                      .build();
              }
              public ExoPlayer getPlayer() { return player; }
              @Override public IBinder onBind(Intent intent) { return binder; }
              @Override public void onDestroy() { player.release(); super.onDestroy(); }
          }
          EOF

          # MainActivity con Gestión de Menú
          cat <<'EOF' > app/src/main/java/com/lyra/audiokernel/MainActivity.java
          package com.lyra.audiokernel;
          import android.os.Bundle;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }

              @Override
              public boolean onCreateOptionsMenu(Menu menu) {
                  getMenuInflater().inflate(R.menu.main_menu, menu);
                  return true;
              }

              @Override
              public boolean onOptionsItemSelected(MenuItem item) {
                  int id = item.getItemId();
                  if (id == R.id.menu_all_music) { openAllMusic(); return true; }
                  if (id == R.id.menu_folders) { openFolders(); return true; }
                  if (id == R.id.menu_playlists) { openPlaylists(); return true; }
                  if (id == R.id.menu_equalizer) { openEqualizer(); return true; }
                  if (id == R.id.menu_search) { openSearch(); return true; }
                  return super.onOptionsItemSelected(item);
              }

              private void openAllMusic() { Toast.makeText(this, "Cargando Toda la Música", Toast.LENGTH_SHORT).show(); }
              private void openFolders() { Toast.makeText(this, "Accediendo a Carpetas", Toast.LENGTH_SHORT).show(); }
              private void openPlaylists() { Toast.makeText(this, "Abriendo Playlists", Toast.LENGTH_SHORT).show(); }
              private void openEqualizer() { Toast.makeText(this, "Iniciando Ecualizador", Toast.LENGTH_SHORT).show(); }
              private void openSearch() { Toast.makeText(this, "Buscador Activo", Toast.LENGTH_SHORT).show(); }
          }
          EOF

      - name: Master Compilation (AEGIS_Ignition)
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Deliver Lyra v1.8 KERNEL Remastered
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-v1.8-KERNEL-Remastered
          path: app/build/outputs/apk/debug/app-debug.apk

