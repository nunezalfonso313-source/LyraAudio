name: Build Lyra KERNEL v1.8 Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        run: |

          mkdir -p app/src/main/java/com/lyra/audiokernel
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat <<'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LyraAudio"
          include ':app'
          EOF

          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          EOF

          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.lyra.audiokernel'
              compileSdk 34

              defaultConfig {

                  applicationId "com.lyra.audiokernel"
                  minSdk 24
                  targetSdk 34
                  versionCode 19
                  versionName "1.8-Stable"

              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-session:1.3.1'

          }
          EOF

      - name: Create Theme
        run: |

          cat <<'EOF' > app/src/main/res/values/styles.xml
          <resources>

              <style name="Theme.Lyra"
                  parent="Theme.AppCompat.DayNight.DarkActionBar"/>

          </resources>
          EOF

      - name: Create Layout
        run: |

          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0A0A0A">

              <ImageView
                  android:id="@+id/album_art"
                  android:layout_width="match_parent"
                  android:layout_height="400dp"
                  android:scaleType="centerCrop"
                  android:background="#111111"/>

          </LinearLayout>
          EOF

      - name: Create Menu
        run: |

          cat <<'EOF' > app/src/main/res/menu/main_menu.xml
          <menu xmlns:android="http://schemas.android.com/apk/res/android">

              <item
                  android:id="@+id/menu_all_music"
                  android:title="Toda la música"/>

              <item
                  android:id="@+id/menu_folders"
                  android:title="Carpetas"/>

              <item
                  android:id="@+id/menu_equalizer"
                  android:title="Ecualizador"/>

          </menu>
          EOF

      - name: Create Activity
        run: |

          cat <<'EOF' > app/src/main/java/com/lyra/audiokernel/MainActivity.java
          package com.lyra.audiokernel;

          import android.os.Bundle;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }

              @Override
              public boolean onCreateOptionsMenu(Menu menu) {

                  getMenuInflater().inflate(R.menu.main_menu, menu);
                  return true;

              }

              @Override
              public boolean onOptionsItemSelected(MenuItem item) {

                  Toast.makeText(this,item.getTitle(),Toast.LENGTH_SHORT).show();
                  return true;

              }
          }
          EOF

      - name: Create Manifest
        run: |

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:label="LyraAudio"
                  android:theme="@style/Theme.Lyra">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service android:name=".LyraPlaybackService"/>

              </application>

          </manifest>
          EOF

      - name: Build APK
        run: |

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyraAudio-v1.8-Stable
          path: app/build/outputs/apk/debug/app-debug.apk
